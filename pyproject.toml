[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bulbd"
version = "0.0.0"          # placeholder: the project has no releases
description = "Make a Xiaomi Mi Smart LED Bulb react to music, the screen, or both."
readme = "README.md"
dependencies = [
    "numpy",
    "yeelight",
    "soundcard",
    "python-miio",
    "mss",
]

[project.optional-dependencies]
# the Xiaomi cloud login / token extractor; the desk runs without it
cloud = [
    "requests",
    "pycryptodome",
    "charset-normalizer",
    "Pillow",
    "colorama",
]
# the ScreenCaptureKit capture backend (--capture sck / auto); macOS only,
# and everything falls back to mss without it
sck = [
    "pyobjc-framework-ScreenCaptureKit; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]
test = ["pytest"]

[project.scripts]
bulbd = "music_bulb:main"
bulbd-desk = "music_bulb_dash:main"

[tool.setuptools]
py-modules = ["music_bulb", "music_bulb_dash", "token_extractor", "sck_capture", "palettes", "lamp_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
